name: sri-verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify required repository files exist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required_paths = [
              "README.md",
              "LICENSE",
              "demo/sri_kernel.py",
              "docs/Quickstart.md",
              "docs/FAQ.md",
              "docs/Proof-Sketch.md",
              "docs/SRI-Architecture-Notes.md",
              "docs/SRI-Challenge.md",
              "docs/SRI_v1.1.pdf",
              "docs/Structural-Resolution-Intelligence-Diagram.png",
              "docs/AI-Evolution-From-Complexity-To-Structure.png",
              "docs/Dependency-Elimination-Framework.png",
              "docs/Shunyaya-Structural-Stack.png",
              "VERIFY/VERIFY.txt",
              "VERIFY/FREEZE_DEMO_SHA256.txt",
          ]

          missing = [p for p in required_paths if not Path(p).exists()]
          if missing:
              print("ERROR: Missing required repository files:")
              for p in missing:
                  print(" -", p)
              sys.exit(1)

          print("Required repository files verified.")
          PY

      - name: Verify frozen SHA256 hash
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          target = Path("demo/sri_kernel.py")
          freeze_path = Path("VERIFY/FREEZE_DEMO_SHA256.txt")
          freeze_text = freeze_path.read_text(encoding="utf-8", errors="replace")

          actual = hashlib.sha256(target.read_bytes()).hexdigest().lower()

          pattern = r"SHA256:\s*([0-9a-f]{64})"
          match = re.search(pattern, freeze_text, re.IGNORECASE)

          if not match:
              print("ERROR: No frozen SHA256 entry found.")
              sys.exit(1)

          expected = match.group(1).lower()

          if actual != expected:
              print("ERROR: Hash mismatch for demo/sri_kernel.py")
              print("Expected:", expected)
              print("Actual:  ", actual)
              sys.exit(1)

          print(f"Hash verified for demo/sri_kernel.py: {actual}")
          PY

      - name: Run SRI Python demo
        shell: bash
        run: |
          python demo/sri_kernel.py

      - name: Verify SRI output
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          cmd = [sys.executable, "demo/sri_kernel.py"]
          result = subprocess.run(cmd, capture_output=True, text=True, check=True)
          out = result.stdout.strip()

          if out != "INCOMPLETE":
              print("ERROR: Unexpected SRI demo output")
              print("Expected: INCOMPLETE")
              print("Actual:  ", out)
              sys.exit(1)

          print("SRI demo output verified.")
          PY

      - name: Verify deterministic demo output
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          cmd = [sys.executable, "demo/sri_kernel.py"]

          result1 = subprocess.run(cmd, capture_output=True, text=True, check=True)
          result2 = subprocess.run(cmd, capture_output=True, text=True, check=True)

          if result1.stdout != result2.stdout:
              print("ERROR: Non-deterministic SRI output for identical run")
              sys.exit(1)

          print("Deterministic SRI output verified.")
          PY

      - name: Verify README contains core SRI claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("README.md").read_text(encoding="utf-8", errors="replace")

          required_snippets = [
              "Structural Resolution Intelligence",
              "Intelligence Admissibility Before AI Execution",
              "intelligence = resolve(structure)",
              "intelligence_visible iff structure_mature",
              "same structure -> same admissibility state",
              "inference_variation != admissibility_variation",
              "Structure determines admissibility",
              "demo/sri_kernel.py",
              "VERIFY/FREEZE_DEMO_SHA256.txt",
          ]

          missing = [snippet for snippet in required_snippets if snippet not in text]
          if missing:
              print("ERROR: README.md is missing expected SRI claims:")
              for snippet in missing:
                  print(" -", snippet)
              sys.exit(1)

          print("README core claims verified.")
          PY
